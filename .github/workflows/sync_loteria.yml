name: Sincronizar Lotería Nacional SELAE

on:
  schedule:
    # Se ejecuta jueves y sábados a las 22:00 UTC
    - cron: '0 22 * * 4,6'
  workflow_dispatch:

jobs:
  actualizar-hoja:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar archivo de credenciales
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_KEY" > credenciales.json

      - name: Ejecutar script de sincronización
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python loteria_nacional_sync.py --actualizar 30
